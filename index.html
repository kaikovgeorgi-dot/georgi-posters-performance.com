<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Georgi Posters Performance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0b0b;
    color:#fff;
}

header{
    padding:25px;
    text-align:center;
    background:#000;
    border-bottom:1px solid #222;
}

header h1{margin:0;font-size:32px;}
header p{color:#aaa;}

section{padding:40px 20px;}

h2{text-align:center;margin-bottom:30px;}

.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    max-width:1200px;
    margin:auto;
}

.gallery img{
    width:100%;
    border-radius:10px;
    transition:0.3s;
    cursor:pointer;
}

.gallery img:hover{
    transform:scale(1.04);
}

.order-box{
    max-width:600px;
    margin:auto;
    background:#111;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.order-box input, .order-box textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:6px;
    background:#1a1a1a;
    color:white;
}

.order-box button{
    width:100%;
    padding:12px;
    background:#e91e63;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.order-box button:hover{
    background:#ff2f7d;
}

.socials{
    text-align:center;
}

.socials a{
    margin:0 12px;
    color:white;
    text-decoration:none;
    font-size:18px;
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>Georgi Posters Performance</h1>
<p>Poster Gallery & Online Orders</p>
</header>

<!-- ГАЛЕРИЯ -->
<section>
<h2>Постери</h2>
<div class="gallery">
<img src="https://i.ibb.co/8LxLj48q/Chat-GPT-Image-17-01-2026-17-20-39.png">
<img src="https://i.ibb.co/JWpXdJ8G/Chat-GPT-Image-28-01-2026-07-37-30.png">
<img src="https://i.ibb.co/QqxZBjv/Chat-GPT-Image-12-01-2026-00-06-57.png">
<img src="https://i.ibb.co/DfL3GFXH/Chat-GPT-Image-8-01-2026-20-59-15.png">
<img src="https://i.ibb.co/RkSY7vG4/Chat-GPT-Image-20-01-2026-22-05-26.png">
</div>
</section>

<!-- ПОРЪЧКИ -->
<section>
<h2>Поръчай постер</h2>

<div class="order-box">
<form action="mailto:yourmail@example.com" method="post" enctype="text/plain">

<input type="text" name="Име" placeholder="Име и фамилия" required>
<input type="tel" name="Телефон" placeholder="Телефон" required>
<input type="email" name="Имейл" placeholder="Имейл" required>
<input type="text" name="Град" placeholder="Град" required>
<input type="text" name="Улица" placeholder="Улица и номер" required>
<input type="text" name="Номер на продукт" placeholder="Номер на продукта" required>

<textarea name="Съобщение" placeholder="Допълнителна информация"></textarea>

<button type="submit">Изпрати поръчка</button>
</form>
</div>
</section>

<!-- СОЦИАЛНИ МРЕЖИ -->
<section class="socials">
<h2>Социални мрежи</h2>
<a href="https://instagram.com" target="_blank">Instagram</a>
<a href="https://facebook.com" target="_blank">Facebook</a>
<a href="https://tiktok.com" target="_blank">TikTok</a>
</section>

<footer>
© 2026 Georgi Posters Performance | Всички права запазени
</footer>

</body>
</html>


<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Georgi Posters Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0b0b;
    color:#fff;
}

header{
    padding:25px;
    text-align:center;
    background:#000;
    border-bottom:1px solid #222;
}

header h1{margin:0;font-size:32px;}
header p{color:#aaa;}

section{padding:40px 20px;}
h2{text-align:center;margin-bottom:30px;}

.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    max-width:1200px;
    margin:auto;
}

.gallery img{
    width:100%;
    border-radius:12px;
    transition:0.3s;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.gallery img:hover{
    transform:scale(1.05);
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>Georgi Posters Performance</h1>
<p>Poster Gallery</p>
</header>

<section>
<h2>Постери</h2>

<div class="gallery">

<img src="https://i.ibb.co/sdt33gZL/Chat-GPT-Image-19-01-2026-23-15-56.png" alt="Poster 1">

<img src="https://i.ibb.co/qL3HJf99/Chat-GPT-Image-29-01-2026-21-08-43.png" alt="Poster 2">

<img src="https://i.ibb.co/ksKC9Yt6/Chat-GPT-Image-29-01-2026-21-07-42.png" alt="Poster 3">

<img src="https://i.ibb.co/vxK7mNs1/Chat-GPT-Image-30-01-2026-22-19-28.png" alt="Poster 4">

</div>
</section>

<footer>
© 2026 Georgi Posters Performance | Всички права запазени
</footer>

</body>
</html>

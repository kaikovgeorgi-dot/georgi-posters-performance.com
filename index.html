<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Georgi Posters Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0c0c0c;color:#fff}
header{background:#000;padding:25px;text-align:center;border-bottom:1px solid #222}
header h1{margin:0;font-size:34px}
nav{margin-top:10px}
nav a{color:#fff;margin:0 15px;text-decoration:none}

.container{max-width:1400px;margin:auto;padding:20px}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px
}

.product{
background:#111;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
overflow:hidden;
display:flex;
flex-direction:column
}

.product img{width:100%}

.product .info{padding:15px}

.product h3{margin:5px 0}
.price{font-size:18px;font-weight:bold;margin:8px 0}

.product button{
padding:10px;
border:none;
border-radius:8px;
background:#e91e63;
color:white;
cursor:pointer;
font-size:15px;
}

.product button:hover{background:#ff2f7d}

.cart-section{
max-width:900px;
margin:60px auto;
background:#0f0f0f;
padding:25px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
}

.cart-item{
border-bottom:1px solid #222;
padding:8px 0;
font-size:14px
}

.total{
text-align:center;
font-size:18px;
margin:15px 0
}

.checkout input,.checkout textarea{
width:100%;
padding:8px;
margin:6px 0;
border:none;
border-radius:6px;
background:#1a1a1a;
color:white
}

.checkout button{
width:100%;
padding:12px;
background:#00e676;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer
}

footer{
text-align:center;
padding:25px;
background:#000;
color:#777;
margin-top:40px
}
</style>
</head>

<body>

<header>
<h1>Georgi Posters Store</h1>
<p style="margin-top:10px;color:#ccc;font-size:16px;">
Нашите Постери , изработени изцяло по ваша идея , и с идеално качество ! Бърза доставка !
</p>
<nav>
<a href="#shop">Магазин</a>
<a href="#order">Поръчка</a>
<a href="#contact">Контакти</a>
</nav>
</header>

<div class="container" id="shop">
<h2>Онлайн магазин</h2>

<div class="products">

<!-- СТАРИ ПОСТЕРИ 1–10 (остават същите) -->

<div class="product">
<img src="https://i.ibb.co/LXFzYH57/Chat-GPT-Image-31-01-2026-00-12-23.png">
<div class="info">
<h3>Poster #11</h3>
<div class="price">15 €</div>
<button onclick="addToCart('Poster #11',15)">Добави в количка</button>
</div>
</div>

<div class="product">
<img src="https://i.ibb.co/nMRxyxcp/528cf65c-f981-41e8-9c58-8ca2f81d9cbd-md.jpg">
<div class="info">
<h3>Poster #12</h3>
<div class="price">15 €</div>
<button onclick="addToCart('Poster #12',15)">Добави в количка</button>
</div>
</div>

</div>
</div>

<div class="cart-section" id="order">
<h2 style="text-align:center;">🛒 Твоята поръчка</h2>

<div id="cartItems"></div>
<div class="total">Общо: <span id="total">0</span> €</div>

<div class="checkout">
<form action="mailto:georgi_kaykov@abv.bg" method="post" enctype="text/plain">
<input type="text" name="Име" placeholder="Име и фамилия" required>
<input type="tel" name="Телефон" placeholder="Телефон" required>
<input type="email" name="Имейл" placeholder="Имейл" required>
<input type="text" name="Град" placeholder="Град" required>
<input type="text" name="Адрес" placeholder="Улица и номер" required>
<textarea name="Поръчка" id="orderData" placeholder="Поръчка"></textarea>
<button type="submit">Финализирай поръчката</button>
</form>
</div>
</div>

<footer id="contact">
<p>© 2026 Georgi Posters Store</p>
<p>Instagram | Facebook | TikTok</p>
</footer>

<script>
let cart=[];
let total=0;

function addToCart(name,price){
cart.push({name,price});
total+=price;
renderCart();
}

function renderCart(){
let cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";
cart.forEach(item=>{
let div=document.createElement("div");
div.className="cart-item";
div.innerText=item.name+" - "+item.price+" €";
cartItems.appendChild(div);
});
document.getElementById("total").innerText=total;
document.getElementById("orderData").value=
cart.map(i=>i.name+" - "+i.price+"€").join(", ")+" | Общо: "+total+" €";
}
</script>

</body>
</html>

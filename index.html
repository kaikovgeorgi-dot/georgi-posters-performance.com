<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Georgi Posters Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0c0c0c;color:#fff}
header{background:#000;padding:25px;text-align:center;border-bottom:1px solid #222}
header h1{margin:0;font-size:34px}
nav{margin-top:10px}
nav a{color:#fff;margin:0 15px;text-decoration:none}

.container{max-width:1400px;margin:auto;padding:20px}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px
}

.product{
background:#111;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
overflow:hidden;
display:flex;
flex-direction:column
}

.product img{width:100%}

.product .info{padding:15px}

.product h3{margin:5px 0}
.price{font-size:18px;font-weight:bold;margin:8px 0}

.product button{
padding:10px;
border:none;
border-radius:8px;
background:#e91e63;
color:white;
cursor:pointer;
font-size:15px;
}
.product button:hover{background:#ff2f7d}

.cart-section{
max-width:900px;
margin:60px auto;
background:#0f0f0f;
padding:25px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
}

.cart-item{border-bottom:1px solid #222;padding:8px 0}
.total{text-align:center;font-size:18px;margin:15px 0}

.checkout input,.checkout textarea{
width:100%;
padding:8px;
margin:6px 0;
border:none;
border-radius:6px;
background:#1a1a1a;
color:white
}

.checkout button{
width:100%;
padding:12px;
background:#00e676;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer
}

footer{
text-align:center;
padding:25px;
background:#000;
color:#777;
margin-top:40px
}
</style>
</head>

<body>

<header>
<h1>Georgi Posters Store</h1>
<p style="margin-top:10px;color:#ccc;font-size:16px;">
Нашите Постери , изработени изцяло по ваша идея , и с идеално качество ! Бърза доставка !
</p>
<nav>
<a href="#shop">Магазин</a>
<a href="#order">Поръчка</a>
<a href="#contact">Контакти</a>
</nav>
</header>

<div class="container" id="shop">
<h2>Онлайн магазин</h2>

<div class="products">

<!-- POSTER 1–12 (ВСИЧКИ) -->
<script>
const posters = [
"https://i.ibb.co/8LxLj48q/Chat-GPT-Image-17-01-2026-17-20-39.png",
"https://i.ibb.co/JWpXdJ8G/Chat-GPT-Image-28-01-2026-07-37-30.png",
"https://i.ibb.co/QqxZBjv/Chat-GPT-Image-12-01-2026-00-06-57.png",
"https://i.ibb.co/DfL3GFXH/Chat-GPT-Image-8-01-2026-20-59-15.png",
"https://i.ibb.co/RkSY7vG4/Chat-GPT-Image-20-01-2026-22-05-26.png",
"https://i.ibb.co/sdt33gZL/Chat-GPT-Image-19-01-2026-23-15-56.png",
"https://i.ibb.co/qL3HJf99/Chat-GPT-Image-29-01-2026-21-08-43.png",
"https://i.ibb.co/ksKC9Yt6/Chat-GPT-Image-29-01-2026-21-07-42.png",
"https://i.ibb.co/vxK7mNs1/Chat-GPT-Image-30-01-2026-22-19-28.png",
"https://i.ibb.co/TBZ0PkQM/Chat-GPT-Image-30-01-2026-23-07-26.png",
"https://i.ibb.co/LXFzYH57/Chat-GPT-Image-31-01-2026-00-12-23.png",
"https://i.ibb.co/nMRxyxcp/528cf65c-f981-41e8-9c58-8ca2f81d9cbd-md.jpg"
];
</script>

</div>
</div>

<div class="cart-section" id="order">
<h2 style="text-align:center;">🛒 Твоята поръчка</h2>
<div id="cartItems"></div>
<div class="total">Общо: <span id="total">0</span> €</div>

<div class="checkout">
<form action="mailto:georgi_kaykov@abv.bg" method="post" enctype="text/plain">
<input type="text" name="Име" placeholder="Име и фамилия" required>
<input type="tel" name="Телефон" placeholder="Телефон" required>
<input type="email" name="Имейл" placeholder="Имейл" required>
<input type="text" name="Град" placeholder="Град" required>
<input type="text" name="Адрес" placeholder="Улица и номер" required>
<textarea name="Поръчка" id="orderData"></textarea>
<button type="submit">Финализирай поръчката</button>
</form>
</div>
</div>

<footer id="contact">
<p>© 2026 Georgi Posters Store</p>
</footer>

<script>
let cart=[], total=0;
const container=document.querySelector(".products");

posters.forEach((src,i)=>{
container.innerHTML+=`
<div class="product">
<img src="${src}">
<div class="info">
<h3>Poster #${i+1}</h3>
<div class="price">15 €</div>
<button onclick="addToCart('Poster #${i+1}',15)">Добави в количка</button>
</div>
</div>`;
});

function addToCart(name,price){
cart.push({name,price});
total+=price;
renderCart();
}

function renderCart(){
const cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";
cart.forEach(i=>{
cartItems.innerHTML+=`<div class="cart-item">${i.name} - ${i.price} €</div>`;
});
document.getElementById("total").innerText=total;
document.getElementById("orderData").value=
cart.map(i=>`${i.name} - ${i.price}€`).join(", ")+" | Общо: "+total+" €";
}
</script>

</body>
</html>
